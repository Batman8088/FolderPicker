name: Build Dylib
on: [push]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Theos
        uses: Randomblock1/theos-action@v1

      - name: Compile Dylib
        run: make

      - name: Upload Dylib
        uses: actions/upload-artifact@v5
        with:
          name: FolderPickerFix-dylib
          path: .theos/obj/**/FolderPickerFix.dylib

  download:
    needs: build
    runs-on: macos-latest
    steps:
      - name: Download Dylib
        uses: actions/download-artifact@v5
        with:
          name: FolderPickerFix-dylib
          path: ./downloaded-files
